name: Deploy to Cloudflare

# prod -> codealgo-web -> codealgoacademy.com + www.codealgoacademy.com
#
# One environment, and `prod` to match the Backend repo. The Vercel deploys this
# replaces had a branch per environment (dev / staging / beta / prod, each with
# its own hostname); those hostnames are gone, so this only watches prod.
#
# Nothing deploys from dev. dev branches off prod, and reaches production by
# pull request - which is what runs ci.yml.

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: cloudflare-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: wrangler refuses to run on anything older
          # ("Wrangler requires at least Node.js v22.0.0"). The app itself is
          # still built on node:20 inside the Docker image, so this only
          # governs the tooling on the runner.
          node-version: '22'

      # NEXT_PUBLIC_* are compiled into the client bundle, so they have to
      # exist before `docker build`, not at container start. wrangler shells
      # out to docker with the repo root as the build context, so writing the
      # file here is enough - the image picks it up.
      #
      # All three are readable in the browser afterwards, hence variables.
      - name: Write .env.production
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          STRIPE_PK: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          ANALYTICS_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "NEXT_PUBLIC_API_URL variable is not set on this repo."
            echo "Without it every API call in the shipped bundle goes to undefined."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_API_URL=$API_URL"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$STRIPE_PK"
            echo "NEXT_PUBLIC_ANALYTICS_URL=$ANALYTICS_URL"
          } > .env.production
          echo "wrote .env.production:"
          sed 's/=.*/=<set>/' .env.production

      - name: Install wrangler
        working-directory: deploy/cloudflare
        run: npm ci || npm install

      - name: Typecheck worker
        working-directory: deploy/cloudflare
        run: npx tsc --noEmit

      # Builds the image, pushes it to the Cloudflare registry, deploys the
      # Worker. First run takes a while; later ones reuse cached layers, and
      # the npm ci layer only rebuilds when package-lock.json changes.
      - name: Deploy
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Before the nameserver move set CF_WEB_BASE_URL to the workers.dev URL,
      # after it set it to https://codealgoacademy.com. Unset means skip.
      #
      # Hits / rather than /__edge/ping on purpose: ping is answered by the
      # Worker without waking the container, so it would pass against a
      # container that cannot render a page.
      - name: Smoke test
        env:
          URL: ${{ vars.CF_WEB_BASE_URL }}
        run: |
          set -e
          if [ -z "$URL" ]; then
            echo "CF_WEB_BASE_URL not set, skipping smoke test"
            exit 0
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "homepage never returned 200"
          exit 1
