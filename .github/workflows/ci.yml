name: CI

# There was no CI on this repo at all, which is how `.eslintrc.json` came to
# reference `eslint-plugin-cypress` without it being in package.json - a clean
# `npm ci` could never build, and only a warm Vercel node_modules cache hid it.
#
# Deliberately light: typecheck both TypeScript projects and confirm the lock
# file is installable. A full `next build` is ~10 minutes because a custom
# .babelrc disables SWC, so that is left to the deploy, which has to build the
# image anyway.
#
# Nothing runs on a push to dev. dev reaches production by pull request, and
# pull_request below covers that.

on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: wrangler refuses to run on anything older
          # ("Wrangler requires at least Node.js v22.0.0"). The app itself is
          # still built on node:20 inside the Docker image, so this only
          # governs the tooling on the runner.
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it fails when package.json and
      # package-lock.json disagree, which is exactly the drift worth catching.
      - name: Install
        run: npm ci

      # next-env.d.ts is generated by `next build` and gitignored, so it does
      # not exist on a clean checkout. It is what declares image imports as
      # modules; without it tsc errors on every `import x from "*.png"`.
      # Writing it here is what `next build` would do anyway.
      - name: Generate next-env.d.ts
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          EOF

      # tsconfig.ci.json excludes tests/ and cypress/ - see the comments there.
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: Install worker deps
        working-directory: deploy/cloudflare
        run: npm ci || npm install

      - name: Typecheck worker
        working-directory: deploy/cloudflare
        run: npx tsc --noEmit

      - name: Install analytics worker deps
        working-directory: deploy/analytics
        run: npm ci

      - name: Typecheck analytics worker
        working-directory: deploy/analytics
        run: npx tsc --noEmit

      # The app's tsconfig excludes deploy/, so the Worker is typechecked
      # separately above. If that exclude is ever removed, `next build` starts
      # failing on `@cloudflare/containers` - which is not resolvable from the
      # app's dependency tree.
      - name: Confirm deploy/ is excluded from the app tsconfig
        run: |
          node -e "
            const fs=require('fs');
            const raw=fs.readFileSync('tsconfig.json','utf8').replace(/^\s*\/\/.*$/gm,'');
            const t=JSON.parse(raw);
            if(!(t.exclude||[]).includes('deploy')){
              console.error('tsconfig.json must exclude \"deploy\" - see the comment in that file');
              process.exit(1);
            }
            console.log('ok');
          "

  # The Worker config has to be valid or the deploy fails after the image has
  # already been built and pushed, which is a slow way to find a typo.
  worker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: wrangler refuses to run on anything older
          # ("Wrangler requires at least Node.js v22.0.0"). The app itself is
          # still built on node:20 inside the Docker image, so this only
          # governs the tooling on the runner.
          node-version: '22'
      - name: Install wrangler
        working-directory: deploy/cloudflare
        run: npm ci || npm install
      - name: Validate wrangler config
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # --containers-rollout=none skips the image build, which needs Docker
        # and a registry push. The deploy workflow builds it for real.
        run: npx wrangler deploy --dry-run --containers-rollout=none --outdir /tmp/w

      # admin.codealgoacademy.com. Separate Worker, deployed by hand, see
      # deploy/analytics/README.md. Only the config is checked here.
      - name: Install analytics wrangler
        working-directory: deploy/analytics
        run: npm ci
      - name: Validate analytics wrangler config
        working-directory: deploy/analytics
        run: npx wrangler deploy --dry-run --outdir /tmp/wa
